# Sentry CLI configuration for the Android build (P11).
#
# THIS FILE IS COMMITTED AND MUST NEVER CONTAIN A SECRET.
# sentry-cli reads the auth token from the SENTRY_AUTH_TOKEN environment
# variable; `auth.token=` here would put a credential in git history. A test
# (src/monitoring/sentryProperties.test.ts) fails if that line ever appears.
#
# Nothing below is needed for local development: the Gradle plugin skips the
# upload entirely for *Debug* variants.
#
# TODO(T11): fill in once the Sentry org and project slugs are known, and
# confirm the region host — an EU-region org uploads to de.sentry.io, not
# sentry.io, and pointing at the wrong one fails the release build.
defaults.url=https://de.sentry.io/
defaults.org=TODO-org-slug
defaults.project=TODO-project-slug
